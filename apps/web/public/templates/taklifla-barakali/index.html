<!doctype html><html lang="uz-Latn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Barakali</title><link rel="icon" href="data:,">
<link rel="stylesheet" href="fonts/fonts.css"><link rel="stylesheet" href="source/template.css">
<link rel="stylesheet" href="source/language.css"><link rel="stylesheet" href="platform.css">
</head><body data-bound="false"><div class="shell">

  
  <section class="hero" data-screen-label="01 Hero">
    
    <svg class="floral tl rise d1" width="120" height="120" viewBox="0 0 120 120" fill="none" aria-hidden="true">
      <path d="M2 28 Q 18 20 34 32 Q 46 42 58 38" stroke="currentColor" stroke-width="0.9" fill="none" opacity="0.7"/>
      <path d="M8 8 Q 22 22 30 40 Q 36 56 30 70" stroke="currentColor" stroke-width="0.9" fill="none" opacity="0.7"/>
      <ellipse cx="14" cy="22" rx="7" ry="3" transform="rotate(-30 14 22)" fill="currentColor" opacity="0.55"/>
      <ellipse cx="32" cy="44" rx="9" ry="3.5" transform="rotate(20 32 44)" fill="currentColor" opacity="0.6"/>
      <ellipse cx="22" cy="60" rx="7" ry="3" transform="rotate(-50 22 60)" fill="currentColor" opacity="0.55"/>
      <g transform="translate(46,30)">
        <circle r="9" fill="#E5B8A8" opacity="0.6"/>
        <circle r="6" fill="#D99584" opacity="0.85"/>
        <circle r="2" fill="#A65445"/>
      </g>
      <circle cx="20" cy="40" r="2" fill="#C8804B" opacity="0.8"/>
      <circle cx="50" cy="14" r="2" fill="#B89968" opacity="0.8"/>
    </svg>
    <svg class="floral tr rise d1" width="120" height="120" viewBox="0 0 120 120" fill="none" aria-hidden="true">
      <path d="M2 28 Q 18 20 34 32 Q 46 42 58 38" stroke="currentColor" stroke-width="0.9" fill="none" opacity="0.7"/>
      <path d="M8 8 Q 22 22 30 40 Q 36 56 30 70" stroke="currentColor" stroke-width="0.9" fill="none" opacity="0.7"/>
      <ellipse cx="14" cy="22" rx="7" ry="3" transform="rotate(-30 14 22)" fill="currentColor" opacity="0.55"/>
      <ellipse cx="32" cy="44" rx="9" ry="3.5" transform="rotate(20 32 44)" fill="currentColor" opacity="0.6"/>
      <ellipse cx="22" cy="60" rx="7" ry="3" transform="rotate(-50 22 60)" fill="currentColor" opacity="0.55"/>
      <g transform="translate(46,30)">
        <circle r="9" fill="#E5B8A8" opacity="0.6"/>
        <circle r="6" fill="#D99584" opacity="0.85"/>
        <circle r="2" fill="#A65445"/>
      </g>
      <circle cx="20" cy="40" r="2" fill="#C8804B" opacity="0.8"/>
      <circle cx="50" cy="14" r="2" fill="#B89968" opacity="0.8"/>
    </svg>
    <svg class="floral bl rise d4" width="100" height="100" viewBox="0 0 100 100" fill="none" aria-hidden="true">
      <path d="M4 20 Q 20 32 36 28 Q 52 24 60 32" stroke="currentColor" stroke-width="0.8" fill="none" opacity="0.6"/>
      <ellipse cx="20" cy="28" rx="6" ry="2.5" transform="rotate(20 20 28)" fill="currentColor" opacity="0.5"/>
      <ellipse cx="40" cy="22" rx="7" ry="3" transform="rotate(-15 40 22)" fill="currentColor" opacity="0.55"/>
      <circle cx="56" cy="30" r="3" fill="#C8804B" opacity="0.75"/>
    </svg>
    <svg class="floral br rise d4" width="100" height="100" viewBox="0 0 100 100" fill="none" aria-hidden="true">
      <path d="M4 20 Q 20 32 36 28 Q 52 24 60 32" stroke="currentColor" stroke-width="0.8" fill="none" opacity="0.6"/>
      <ellipse cx="20" cy="28" rx="6" ry="2.5" transform="rotate(20 20 28)" fill="currentColor" opacity="0.5"/>
      <ellipse cx="40" cy="22" rx="7" ry="3" transform="rotate(-15 40 22)" fill="currentColor" opacity="0.55"/>
      <circle cx="56" cy="30" r="3" fill="#C8804B" opacity="0.75"/>
    </svg>

    <div class="hero-frame"></div>

    <div class="hero-top">
      <div class="hero-mono rise d1"></div>
      <span class="eyebrow hero-eye rise d2"></span>
    </div>

    <div class="hero-mid">
      <div class="hero-occasion rise d2"></div>
      <h1 class="hero-name rise d3"></h1>
      <div class="hero-age rise d4" hidden></div>
      <div class="hero-meta rise d5">
        <div class="hero-meta-cell">
          <span class="label">Sana</span>
          <span class="hero-meta-val" data-i18n-date="date"></span>
        </div>
        <div class="hero-meta-divider"></div>
        <div class="hero-meta-cell">
          <span class="label">Vaqt</span>
          <span class="hero-meta-val"></span>
        </div>
      </div>
    </div>

    <div class="hero-bottom rise d5">
      <div class="scroll-hint">Pastga torting</div>
      <div class="scroll-arrow"></div>
    </div>
  </section>

  
  <section class="greet reveal" data-screen-label="02 Greeting">
    <span class="eyebrow greet-eye"></span>
    <div class="rule-h"></div>
    <p class="greet-quote"></p>
    <div class="greet-sign"></div>
  </section>

  
  <section class="photo-sec reveal" data-screen-label="03 Photo">
    <span class="eyebrow photo-eye"></span>
    <div class="photo-frame" role="img" aria-label="">
      <span class="photo-mono"></span>
      <svg class="photo-blooms" viewBox="0 0 300 110" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
        <path d="M0 96 Q 60 70 120 88 Q 180 102 240 78 Q 280 62 300 80 L 300 110 L 0 110 Z" fill="currentColor" opacity="0.35"/>
        <path d="M30 92 Q 50 78 70 88" stroke="currentColor" stroke-width="0.9" fill="none" opacity="0.7"/>
        <path d="M150 86 Q 170 70 190 84" stroke="currentColor" stroke-width="0.9" fill="none" opacity="0.7"/>
        <ellipse cx="50" cy="86" rx="8" ry="3" transform="rotate(-20 50 86)" fill="currentColor" opacity="0.55"/>
        <ellipse cx="180" cy="80" rx="9" ry="3.2" transform="rotate(-15 180 80)" fill="currentColor" opacity="0.55"/>
        <ellipse cx="240" cy="86" rx="8" ry="3" transform="rotate(15 240 86)" fill="currentColor" opacity="0.55"/>
        <circle cx="100" cy="80" r="6" fill="#E5B8A8" opacity="0.85"/>
        <circle cx="100" cy="80" r="3" fill="#C97766"/>
        <circle cx="220" cy="76" r="5" fill="#E5B8A8" opacity="0.85"/>
        <circle cx="220" cy="76" r="2.5" fill="#C97766"/>
        <circle cx="70" cy="74" r="2.5" fill="#C8804B" opacity="0.85"/>
        <circle cx="160" cy="74" r="3" fill="#B89968" opacity="0.9"/>
        <circle cx="270" cy="80" r="2.5" fill="#C8804B" opacity="0.85"/>
      </svg>
    </div>
    <div class="photo-cap"></div>
  </section>

  
  <section class="countdown reveal" data-screen-label="04 Countdown">
    <span class="eyebrow countdown-eye"></span>
    <div class="cd-grid" id="countdown" aria-live="polite">
      <div class="cd-cell"><div class="cd-num" id="cd-d">000</div><div class="cd-label">Kun</div></div>
      <div class="cd-cell"><div class="cd-num" id="cd-h">00</div><div class="cd-label">Soat</div></div>
      <div class="cd-cell"><div class="cd-num" id="cd-m">00</div><div class="cd-label">Daqiqa</div></div>
      <div class="cd-cell"><div class="cd-num" id="cd-s">00</div><div class="cd-label">Soniya</div></div>
    </div>
    <div class="cd-date" data-i18n-date="date-weekday"></div>
  </section>

  
  <section class="details reveal" data-screen-label="05 When &amp; Where">
    <span class="eyebrow details-eye"></span>
    <div class="details-card">
      <div class="det-row">
        <div class="det-mark" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <rect x="2" y="3.5" width="12" height="10" rx="1" stroke="currentColor" stroke-width="1.1"/>
            <path d="M2 6.5 H14" stroke="currentColor" stroke-width="1.1"/>
            <path d="M5 2 V5 M11 2 V5" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="det-body">
          <span class="label">Sana &amp; Vaqt</span>
          <div class="det-val" data-i18n-date="date"></div>
          <div class="det-sub" data-i18n-date="weekday-time"></div>
        </div>
      </div>

      <div class="det-row">
        <div class="det-mark" aria-hidden="true">
          <svg width="16" height="18" viewBox="0 0 16 18" fill="none">
            <path d="M8 1 C 4 1 1.5 3.8 1.5 7 C 1.5 11.5 8 17 8 17 C 8 17 14.5 11.5 14.5 7 C 14.5 3.8 12 1 8 1 Z" stroke="currentColor" stroke-width="1.1" fill="none"/>
            <circle cx="8" cy="7" r="2.2" stroke="currentColor" stroke-width="1.1"/>
          </svg>
        </div>
        <div class="det-body">
          <span class="label">Manzil</span>
          <div class="det-val"></div>
          <div class="det-sub"></div>
        </div>
      </div>

      <div class="det-row">
        <div class="det-mark" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M3 2.5 L6 2.5 L7.2 5.4 L5.4 6.6 C 6.4 8.6 7.4 9.6 9.4 10.6 L 10.6 8.8 L 13.5 10 L 13.5 13 C 13.5 13.6 13 14 12.5 14 C 7 13.6 2.4 9 2 3.5 C 2 3 2.4 2.5 3 2.5 Z" stroke="currentColor" stroke-width="1.1" fill="none" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="det-body">
          <span class="label">Aloqa</span>
          <a class="det-val" id="phone-link" href="#" style="color:var(--ink);text-decoration:none;border-bottom:1px dotted var(--line)"></a>
          <div class="det-sub"></div>
        </div>
      </div>

      <div class="det-actions">
        <a class="btn btn-primary" id="map-yandex" href="#" target="_blank" rel="noopener">Yandex</a>
        <a class="btn" id="map-google" href="#" target="_blank" rel="noopener">Google Maps</a>
      </div>
    </div>
  </section>

  
  <section class="rsvp reveal" data-screen-label="06 RSVP">
    <div class="rsvp-head">
      <span class="eyebrow rsvp-eye"></span>
      <h2 class="rsvp-title"></h2>
      <p class="rsvp-sub"></p>
    </div>
    <form class="rsvp-form" id="rsvp-form" novalidate>
      <input id="g-name" type="text" placeholder="Ismingiz" maxlength="40" autocomplete="name" aria-label="Ismingiz"/>
      <textarea id="g-text" placeholder="Tabrik so'zi..." maxlength="280" aria-label="Tabrik so'zi"></textarea>
      <button class="btn btn-primary" type="submit">
        <span>Yuborish</span>
        <span aria-hidden="true">→</span>
      </button>
      <div class="rsvp-thanks" id="rsvp-thanks" role="status" aria-live="polite"></div>
    </form>
    <div class="wish-list" id="wish-list" aria-live="polite"></div>
  </section>

  
  <section class="closing" data-screen-label="07 Closing">
    <div class="closing-mono"></div>
    <div class="closing-script"></div>
    <div class="closing-meta" data-i18n-date="date-time-venue"></div>
  </section>

  <div class="footer">
    <div class="footer-text"></div>
  </div>
</div>


<button class="music-fab" id="music-fab" type="button" aria-pressed="false" aria-label="Musiqani yoqish">
  <span class="ico" id="music-ico" aria-hidden="true">
    
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
      <path d="M3 6.5 L3 11.5 L6.5 11.5 L10.5 14.5 L10.5 3.5 L6.5 6.5 Z" fill="currentColor"/>
      <path d="M13 6.5 L16 9.5 M16 6.5 L13 9.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    </svg>
  </span>
  <span id="music-label">Musiqani yoqish</span>
</button>
<audio id="music-audio" preload="none" loop></audio>

<div class="taklifla-lang-switch" role="group" aria-label="Language">
  <button type="button" class="taklifla-lang-toggle" aria-haspopup="menu" aria-expanded="false">
    <span class="taklifla-lang-current">Uz</span>
    <span class="chev" aria-hidden="true">▾</span>
  </button>
  <div class="taklifla-lang-menu" role="menu">
    <button type="button" data-lang="uz-Latn" role="menuitemradio">Uz</button>
    <hr />
    <button type="button" data-lang="uz-Cyrl" role="menuitemradio">Уз</button>
    <hr />
    <button type="button" data-lang="en" role="menuitemradio">En</button>
    <hr />
    <button type="button" data-lang="ru" role="menuitemradio">Ru</button>
  </div>
</div>
<script src="bridge.js"></script><script src="source/motion.js"></script></body></html>
