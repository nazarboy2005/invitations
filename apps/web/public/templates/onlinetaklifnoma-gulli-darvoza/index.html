<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#fbf7f0" />
    <title>Taklifnoma</title>
    <link rel="stylesheet" href="/templates/onlinetaklifnoma-gulli-darvoza/template.css" />
  </head>
  <body>
    <main class="invitation" id="invitation" data-state="closed" aria-live="off">
      <section class="cover" aria-label="Taklifnomani ochish">
        <img class="cover-art cover-art--couple" src="/templates/onlinetaklifnoma-gulli-darvoza/source/assets/couple.webp" alt="" />
        <img class="cover-art cover-art--gate" src="/templates/onlinetaklifnoma-gulli-darvoza/source/assets/gate.webp" alt="" />
        <video class="cover-video" playsinline preload="none" aria-hidden="true" poster="/templates/onlinetaklifnoma-gulli-darvoza/source/assets/gate.webp" src="/templates/onlinetaklifnoma-gulli-darvoza/source/assets/intro.mp4"></video>
        <div class="cover-shade"></div>
        <label class="language-picker"><span class="sr-only">Language</span><select data-locale aria-label="Language"></select></label>
        <div class="cover-content">
          <p class="invocation" data-bind="invocation"></p>
          <div class="cover-names"><span data-bind="groom"></span><i>&amp;</i><span data-bind="bride"></span></div>
          <p class="cover-date" data-bind="date"></p>
          <div class="countdown countdown--cover" data-countdown></div>
          <button class="open-button" type="button" data-action="open" data-bind="open"></button>
        </div>
        <button class="skip-button" type="button" data-action="skip" data-bind="skip"></button>
        <button class="sound-button" type="button" data-action="sound" aria-label="Toggle sound">♫</button>
      </section>
      <div class="paper">
        <section class="intro section-reveal">
          <span class="rule-ornament" aria-hidden="true"><i></i><b>✦</b><i></i></span>
          <p class="intro-message" data-bind="message"></p>
          <p class="eyebrow" data-bind="hostsLabel"></p>
          <p class="hosts" data-bind="hosts"></p>
        </section>
        <section class="date-section section-reveal">
          <p class="eyebrow" data-bind="dateHeading"></p>
          <div class="date-lockup"><span data-bind="month"></span><strong data-bind="day"></strong><span data-bind="year"></span></div>
          <p class="event-time" data-bind="weekdayTime"></p>
          <p class="eyebrow countdown-label" data-bind="countdownHeading"></p>
          <div class="countdown countdown--paper" data-countdown></div>
        </section>
        <section class="venue-section section-reveal">
          <p class="eyebrow" data-bind="venueHeading"></p>
          <span class="venue-flower" aria-hidden="true">❀</span>
          <h2 data-bind="venueName"></h2>
          <p class="venue-address" data-bind="address"></p>
          <p class="venue-time" data-bind="venueTime"></p>
          <a class="map-link" data-bind="map" target="_blank" rel="noreferrer"></a>
        </section>
        <section class="program-section section-reveal" data-section="program" hidden>
          <p class="eyebrow" data-bind="programHeading"></p>
          <div class="program-list" data-list="program"></div>
        </section>
        <section class="gallery-section section-reveal" data-section="gallery" hidden>
          <p class="eyebrow" data-bind="galleryHeading"></p>
          <div class="gallery-grid" data-list="gallery"></div>
        </section>
        <section class="gift-section section-reveal" data-section="gift" hidden>
          <span class="gift-rosette" aria-hidden="true">✿</span>
          <p class="eyebrow" data-bind="giftHeading"></p>
          <p class="gift-caption" data-bind="giftCaption"></p>
          <div class="gift-plaque"><span class="gift-holder" data-bind="giftHolder"></span><span class="gift-number" data-bind="giftNumber"></span><button type="button" data-action="copy"></button></div>
          <p class="copy-feedback" role="status" aria-live="polite" data-bind="copyFeedback"></p>
        </section>
        <section class="rsvp-section section-reveal" data-section="rsvp">
          <span class="rule-ornament" aria-hidden="true"><i></i><b>✦</b><i></i></span>
          <h2 data-bind="rsvpHeading"></h2><p class="form-hint" data-bind="rsvpHint"></p>
          <form data-form="rsvp">
            <label><span data-bind="nameLabel"></span><input name="name" maxlength="100" required /></label>
            <label><span data-bind="answerLabel"></span><select name="status"><option value="yes" data-bind="yes"></option><option value="maybe" data-bind="maybe"></option><option value="no" data-bind="no"></option></select></label>
            <label class="party-size"><span data-bind="partyLabel"></span><input name="partySize" type="number" min="1" max="100" value="1" /></label>
            <button class="submit-button" type="submit" data-bind="submitRsvp"></button>
            <p class="form-feedback" role="status" aria-live="polite" data-feedback="rsvp"></p>
          </form>
        </section>
        <section class="wishes-section section-reveal" data-section="wishes" hidden>
          <p class="eyebrow" data-bind="wishesHeading"></p><p class="form-hint" data-bind="wishesHint"></p>
          <form data-form="wish">
            <label><span data-bind="nameLabel"></span><input name="name" maxlength="100" required /></label>
            <label><span data-bind="wishLabel"></span><textarea name="message" maxlength="2000" rows="3" required></textarea></label>
            <button class="submit-button" type="submit" data-bind="submitWish"></button>
            <p class="form-feedback" role="status" aria-live="polite" data-feedback="wish"></p>
          </form>
          <div class="wishes-list" data-list="wishes"></div>
        </section>
        <footer class="closing section-reveal">
          <p class="eyebrow" data-bind="closing"></p><p class="closing-names" data-bind="names"></p><p class="hosts"></p>
          <div class="contacts" data-list="contacts"></div>
        </footer>
      </div>
    </main>
    <audio data-music loop preload="none"></audio>
    <script src="/templates/onlinetaklifnoma-gulli-darvoza/bridge.js" defer></script>
  </body>
</html>
