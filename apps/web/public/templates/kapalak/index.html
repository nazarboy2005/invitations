        <section class="opening-scene" id="top">
            <div class="scene-header">
                <div class="scene-header-stack">
                    <div class="monogram" aria-label="Invitation monogram">
                        <span></span>
                        <b></b>
                    </div>
                    <p class="scene-tag">TAKLIFNOMA</p>
                </div>
            </div>

            <div class="door-stage" id="doorStage">
                <div class="invitation-core">
                    <p class="eyebrow">Bismillahir rohmanir rohim</p>
                    <h1><span>&amp;</span></h1>
                    <p class="hero-date"></p>
                    <p class="hero-text">

                    </p>

                    <div class="countdown" id="countdown">
                        <div class="countdown-item">
                    <strong id="days">00</strong>
                            <span>kun</span>
                        </div>
                        <div class="countdown-item">
                            <strong id="hours">00</strong>
                            <span>soat</span>
                        </div>
                        <div class="countdown-item">
                            <strong id="minutes">00</strong>
                            <span>daq</span>
                        </div>
                        <div class="countdown-item">
                            <strong id="seconds">00</strong>

                        </div>

            </div>
        </section>

                <article class="info-panel statement-panel scroll-reveal" style="--reveal-delay: 0ms;">
                    <p class="section-tag"></p>
                    <h2></h2>
                    <p></p>
                </article>

                <article class="info-panel details-panel scroll-reveal" style="--reveal-delay: 140ms;">
                    <div class="detail-item">
                        <span class="detail-title">Sana</span>
