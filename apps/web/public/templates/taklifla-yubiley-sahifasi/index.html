<!DOCTYPE html>

<html lang="uz-Latn">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport"/>
<title>Yubiley sahifasi</title>





<link href="source/fonts.css" rel="stylesheet"/><link href="source/template.css" rel="stylesheet"/><link href="source/controls.css" rel="stylesheet"/><link href="platform.css" rel="stylesheet"/></head>
<body>



<svg aria-hidden="true" height="0" style="position:absolute" width="0">
<defs>

<pattern height="20" id="meander" patternunits="userSpaceOnUse" width="24" x="0" y="0">
<path d="M0 18 L24 18 M2 18 L2 4 L18 4 L18 14 L8 14 L8 8 L14 8 L14 12" fill="none" stroke="currentColor" stroke-linecap="square" stroke-linejoin="miter" stroke-width="1.2"></path>
</pattern>

<symbol id="ic-pin" viewbox="0 0 26 26">
<g fill="none" stroke="currentColor" stroke-linecap="square" stroke-width="1.4">
<path d="M13 25 C 13 25 22 16 22 10 A 9 9 0 1 0 4 10 C 4 16 13 25 13 25 Z" fill="currentColor" fill-opacity="0.18"></path>
<circle cx="13" cy="10" fill="currentColor" r="3"></circle>
</g>
</symbol>

<symbol id="geo-band" viewbox="0 0 120 14">
<g fill="none" stroke="currentColor" stroke-linecap="square" stroke-width="1">
<path d="M0 7 L46 7"></path>
<path d="M74 7 L120 7"></path>
<path d="M52 1 L60 7 L52 13 L44 7 Z" fill="currentColor" fill-opacity="0.85" stroke="none"></path>
<path d="M68 1 L76 7 L68 13 L60 7 Z" fill="currentColor" fill-opacity="0.85" stroke="none"></path>
</g>
</symbol>
</defs>
</svg>
<div class="shell">

<section class="hero">

<div class="hero-double top"></div>
<svg aria-hidden="true" class="meander-band top" preserveaspectratio="xMidYMid slice" viewbox="0 0 480 28">
<rect fill="url(#meander)" height="28" width="100%"></rect>
</svg>
<div class="hero-double top2"></div>
<div class="hero-mid">
<div class="hero-eyebrow"></div>
<div class="hero-25" hidden=""></div>
<div class="hero-25-sub"></div>
<h1 class="hero-company"></h1>
<div class="hero-tagline"></div>
<div class="hero-meta">
<div class="hero-meta-cell">
<span class="label" style="font-size:9px;">Sana</span>
<span class="hero-meta-val"></span>
</div>
<div class="hero-meta-divider"></div>
<div class="hero-meta-cell">
<span class="label" style="font-size:9px;">Vaqt</span>
<span class="hero-meta-val"></span>
</div>
</div>
<div>
<div class="scroll-hint" style="margin-top:36px;">Pastga torting</div>
<div class="scroll-arrow"></div>
</div>
</div>

<div class="hero-double bot2"></div>
<svg aria-hidden="true" class="meander-band bottom" preserveaspectratio="xMidYMid slice" viewbox="0 0 480 28">
<rect fill="url(#meander)" height="28" width="100%"></rect>
</svg>
<div class="hero-double bot"></div>
</section>

<section class="founder reveal">
<span class="founder-eyebrow eyebrow">Asoschidan</span>
<div aria-hidden="true" class="founder-mark">“</div>
<p class="founder-quote"></p>
<div class="rule-h"></div>
<div class="founder-sig"></div>
<div class="founder-name"></div>
<div class="founder-role"></div>
</section>

<section class="timeline reveal">
<div class="timeline-head">
<span class="eyebrow">Bosib o'tilgan yo'l</span>
<h2>Choragi asr — besh bosqich</h2>
</div>
<div class="timeline-rail"></div>
<svg aria-hidden="true" class="geo-divider" style="display:block; margin:36px auto 0; width:120px; height:14px; color:var(--accent);"><use href="#geo-band"></use></svg>
</section>

<section class="numbers reveal" hidden="">
<span class="numbers-eyebrow">Raqamlarda</span>
<div class="numbers-grid">
<div class="stat">
<div class="stat-val"></div>
<div class="stat-label"></div>
</div>
<div class="stat">
<div class="stat-val"></div>
<div class="stat-label"></div>
</div>
<div class="stat">
<div class="stat-val"></div>
<div class="stat-label"></div>
</div>
<div class="stat">
<div class="stat-val"></div>
<div class="stat-label"></div>
</div>
</div>
</section>

<section class="agenda reveal">
<div class="agenda-head">
<span class="eyebrow">Kun tartibi</span>
<h2>Marosim bosqichlari</h2>
</div>
<div class="agenda-list"></div>
</section>

<section class="venue reveal">
<span class="venue-eyebrow eyebrow">Marosim joyi</span>
<div class="venue-name"></div>
<div class="venue-addr"></div>
<div class="venue-meta">
<div class="venue-meta-cell">
<span class="venue-meta-label">Sana</span>
<span class="venue-meta-val"></span>
</div>
<div class="venue-meta-cell">
<span class="venue-meta-label">Vaqt</span>
<span class="venue-meta-val"></span>
</div>
</div>
<a class="venue-map" href="#" target="_blank" rel="noopener" aria-label="Yandex Maps">
<svg preserveaspectratio="xMidYMid slice" viewbox="0 0 380 160">
<defs>
<pattern height="24" id="map-grid" patternunits="userSpaceOnUse" width="24" x="0" y="0">
<path d="M0 24 L24 24 M24 0 L24 24" fill="none" opacity="0.18" stroke="#1F2A4A" stroke-width="0.4"></path>
</pattern>
</defs>
<rect fill="#FBF6EC" height="160" width="380"></rect>
<rect fill="url(#map-grid)" height="160" width="380"></rect>
<path d="M0 80 Q 100 60 200 88 T 380 70" fill="none" opacity="0.7" stroke="#B89968" stroke-width="1.2"></path>
<path d="M40 0 L60 160" fill="none" opacity="0.22" stroke="#1F2A4A" stroke-width="1"></path>
<path d="M280 0 L300 160" fill="none" opacity="0.22" stroke="#1F2A4A" stroke-width="1"></path>
<path d="M0 130 L380 110" fill="none" opacity="0.22" stroke="#1F2A4A" stroke-width="1"></path>
</svg>
<svg aria-hidden="true" class="venue-pin"><use href="#ic-pin"></use></svg>
</a>
</section>

<section class="rsvp reveal" id="rsvp-section">
<div class="rsvp-head">
<span class="eyebrow">Tasdiqlash</span>
<h2>Ishtirokingizni bildiring</h2>
<p class="body"></p>
</div>
<div class="rsvp-form" id="rsvp-form">
<div class="rsvp-attend" id="rsvp-attend">
<label class="on" data-val="yes">
<input checked="" name="attend" type="radio" value="yes"/>
<span>Ishtirok etaman</span>
</label>
<label data-val="no">
<input name="attend" type="radio" value="no"/>
<span>Kela olmayman</span>
</label>
</div>
<input autocomplete="name" id="rsvp-name" maxlength="60" placeholder="Ism va familiya" type="text"/>
<input aria-label="Tashkilot yoki lavozim — hozircha qo‘llab-quvvatlanmaydi" disabled="" hidden="" id="rsvp-org" maxlength="80" placeholder="Tashkilot yoki lavozim" type="text"/>
<textarea id="rsvp-note" maxlength="280" placeholder="Qo'shimcha ma'lumot (ixtiyoriy)"></textarea>
<button class="btn btn-primary" id="rsvp-submit" type="button">
<span>Yuborish</span>
<span style="font-size:14px;">→</span>
</button>
</div>
<div class="rsvp-thanks" id="rsvp-thanks" hidden></div>
</section>

<section class="closing reveal">
<div class="closing-25" hidden=""></div>
<div class="closing-25-sub"></div>
<svg aria-hidden="true" class="geo-divider" style="display:block; margin:22px auto 0; width:120px; height:14px; color:var(--accent);"><use href="#geo-band"></use></svg>
<div class="closing-company"></div>
<div class="closing-meta"></div>

<svg aria-hidden="true" class="meander-band" preserveaspectratio="xMidYMid slice" style="margin-top:38px;" viewbox="0 0 320 22">
<rect fill="url(#meander)" height="22" width="100%"></rect>
</svg>
</section>
<div class="footer">

</div>
</div>



<audio id="bgMusic" loop="" preload="none"></audio>
<button aria-label="Musiqa" class="taklifla-music-btn" hidden="" id="taklifla-music-btn" type="button">
<svg aria-hidden="true" fill="currentColor" height="14" viewbox="0 0 24 24" width="14"><path d="M8 5v14l11-7z"></path></svg>
<span class="taklifla-music-label">Musiqa</span>
</button>



<div aria-label="Language" class="taklifla-lang-switch" role="group">
<button aria-expanded="false" aria-haspopup="menu" class="taklifla-lang-toggle" type="button">
<span class="taklifla-lang-current">UZ</span>
<span aria-hidden="true" class="chev">▾</span>
</button>
<div class="taklifla-lang-menu" role="menu"><button data-locale="uz-Latn" role="menuitemradio" type="button">Uz</button><button data-locale="uz-Cyrl" role="menuitemradio" type="button">Уз</button><button data-locale="en" role="menuitemradio" type="button">En</button><button data-locale="ru" role="menuitemradio" type="button">Ru</button></div>
</div>




<script defer="" src="bridge.js"></script><script defer="" src="source/motion.js"></script></body>
</html>
