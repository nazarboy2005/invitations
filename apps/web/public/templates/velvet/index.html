<html lang="ru">

<head>
    </style>
    
    
    <title>Velvet invitation</title>
    <link rel="stylesheet" href="./assets/fonts/merriweather-open-sans.css" />
    <link rel="stylesheet" href="./assets/fonts/playfair.css" />
    <link rel="stylesheet" href="./assets/fonts/great-vibes.css" />
    <link rel="stylesheet" href="./assets/css/animate.min.css" />
    <link rel="stylesheet" href="./assets/css/velvet.css" />
    <!-- SEO Meta Tags -->
    
    

    <!-- Open Graph / Facebook -->
    
    
    

    <!-- Twitter -->
    
    
    
    
    
    


    <!-- Favicon -->
    
</head>

<body>
    <div id="loading-screen">
        <video class="video-bg" autoplay="" loop="" muted="" playsinline="">
            <source src="./assets/previews/template/velvet/velvet.mp4" type="video/mp4" />
        </video>
        <div class="slider-content">
            <h2>WEDDING</h2>
            <p data-velvet="unlock"></p>
            <div class="slider-container">
                <div class="slider-handle">
                    <svg viewBox="0 0 44 82" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M2.00017 2.81623L40.1839 41L2.00017 79.1838" stroke="#9E9E9E" stroke-width="10"
                            stroke-linecap="round"></path>
                    </svg>
                </div>
                <div class="slider-track-text"></div>
                <div class="slider-track-bg"></div>
            </div>
        </div>
    </div>
    <div class="page-background-video">
        <video autoplay="" muted="" loop="" playsinline="" class="video-bg"
            style="width: 100%; height: 100%; object-fit: cover">
            <source src="./assets/previews/template/velvet/pink.mp4" type="video/mp4" />
        </video>
    </div>
    <audio id="background-music" loop="" src="./assets/images/velvet/chris.mp3"></audio>
    <div class="mute-button">
        <div class="mute-icon-wrapper">
            <span class="mute-icon" aria-hidden="true">♪</span>
        </div>
        <span class="mute-label">← Выключить звук музыки</span>
    </div>
    <!-- Section 1 -->
    <section class="fade-in delay-1 fade-in-on-scroll">
        <h1 class="title" data-velvet="person-0"></h1>
        <h2 class="title and-text" data-velvet="and"></h2>
        <h1 class="title" data-velvet="person-1"></h1>
    </section>
    <!-- Section 2 -->
    <section class="fade-in guests-section delay-2 fade-in-on-scroll">
        <h2 class="title guests" data-velvet="greeting"></h2>
        <p data-velvet="message"></p>
    </section>
    <section class="fade-in delay-3">
        <div class="calendar-wrapper">
            <div class="calendar-title" data-velvet="calendar-title"></div>
            <div class="calendar">
                <div class="calendar-day"></div><div class="calendar-day"></div><div class="calendar-day"></div><div class="calendar-day"></div><div class="calendar-day"></div><div class="calendar-day"></div><div class="calendar-day"></div>
                <div class="calendar-date"></div>
                <div class="calendar-date"></div>
                <div class="calendar-date"></div>
                <div class="calendar-date">1</div>
                <div class="calendar-date">2</div>
                <div class="calendar-date">3</div>
                <div class="calendar-date">4</div>
                <div class="calendar-date">5</div>
                <div class="calendar-date">6</div>
                <div class="calendar-date">7</div>
                <div class="calendar-date">8</div>
                <div class="calendar-date">9</div>
                <div class="calendar-date">10</div>
                <div class="calendar-date">11</div>
                <div class="calendar-date">12</div>
                <div class="calendar-date">13</div>
                <div class="calendar-date">14</div>
                <div class="calendar-date">15</div>
                <div class="calendar-date">16</div>
                <div class="calendar-date">17</div>
                <div class="calendar-date">18</div>
                <div class="calendar-date">19</div>
                <div class="calendar-date">20</div>
                <div class="calendar-date">21</div>
                <div class="calendar-date">22</div>
                <div class="calendar-date">23</div>
                <div class="calendar-date">24</div>
                <div class="calendar-date">25</div>
                <div class="calendar-date">26</div>
                <div class="calendar-date">27</div>
                <div class="calendar-date">28</div>
                <div class="calendar-date">29</div>
                <div class="calendar-date heart-day">
                    30
                    <div class="heart">❤</div>
                </div>
                <div class="calendar-date">31</div>
            </div>
        </div>
    </section>
    <!-- Section 4: Program Day -->
    <section class="fade-in program-section delay-4">
        <h2 class="title guests" data-velvet="program-heading"></h2>
        <div class="program-item">
            <h3 class="subtitle">15:30</h3>
            <p>ТОРЖЕСТВЕННАЯ ЦЕРЕМОНИЯ</p>
        </div>
        <div class="program-item">
            <h3 class="subtitle">17:00</h3>
            <p>БАНКЕТ</p>
        </div>
        <div class="program-item">
            <h3 class="subtitle">21:30</h3>
            <p>СВАДЕБНЫЙ ТОРТ</p>
        </div>
    </section>
    <!-- Section 5: Location -->
    <section class="fade-in delay-4 location-section">
        <h2 class="title guests" data-velvet="location-heading"></h2>
        <div class="location-content">
            <img src="./assets/images/velvet/image1.png" alt="Локация"
                style="max-width: 100%; border-radius: 12px; margin: 20px 0" />
            <p data-velvet="address-intro"></p>
            <p>
                <strong data-velvet="venue-name"></strong><br />
                <span data-velvet="venue-address"></span>
            </p>
            <a id="venue-map" href="#" target="_blank" style="
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: transparent;
            color: #000;
            text-decoration: none;
            border: 2px solid #000;
            border-radius: 6px;
            font-family: &quot;Open Sans&quot;, Arial, sans-serif;
            min-width: 200px;
            text-align: center;
          ">Open map</a>
        </div>
    </section>
    <!-- Section 6: Dress Code -->
    <section class="fade-in delay-4 dresscode-section">
        <h2 class="title guests" data-velvet="dress-heading"></h2>
        <p>
            <span data-velvet="dress-code"></span>
        </p>
        <img src="./assets/images/velvet/look.png" alt="Дресс код"
            style="max-width: 100%; border-radius: 12px; margin: 20px 0" />
    </section>
    <!-- Section 7: Details -->
    <section class="fade-in delay-4 details-section">
        <h2 class="title guests" data-velvet="details-heading"></h2>
        <p data-velvet="gift-note"></p>
    </section>

    <!-- Section 9: Photos -->
    <section class="fade-in delay-4 photos-section">
        <h2 class="title guests" data-velvet="photos-heading"></h2>
        <p data-velvet="photos-note"></p>
        <a data-velvet="photos-link" style="
          display: inline-block;
          margin-top: 20px;
          padding: 12px 24px;
          background: transparent;
          color: #000;
          text-decoration: none;
          border: 2px solid #000;
          border-radius: 6px;
          font-family: &quot;Open Sans&quot;, Arial, sans-serif;
          min-width: 200px;
          text-align: center;
        ">Open photos</a>
    </section>
    <!-- Section 10: Form -->
    <section class="fade-in delay-4 form-section">
        <h2 class="title guests" data-velvet="rsvp-heading"></h2>
        <p data-velvet="rsvp-intro"></p>
        <div id="rsvp-container">
            <form id="rsvp-form">
                <label class="heading" for="fio" data-velvet="name-label"></label>
                <input type="text" id="fio" name="name" required="" />
                <div style="margin-top: 40px"></div>
                <label class="heading" data-velvet="attendance-label"></label>
                <label><input type="radio" name="attendance" value="yes" required="" /> <span data-velvet="attendance-yes"></span></label>
                <label><input type="radio" name="attendance" value="no" /> <span data-velvet="attendance-no"></span></label>
                <label><input type="radio" name="attendance" value="maybe" /> <span data-velvet="attendance-maybe"></span></label>

                <div style="margin-top: 40px"></div>

                <label class="heading" for="track" data-velvet="song-label"></label>
                <input type="text" id="track" name="song" />

                <button type="submit" data-velvet="submit"></button>
            </form>
        </div>
    </section>

    <!-- Section 11: Countdown -->
    <section class="fade-in delay-4 countdown-section">
        <h2 class="title guests" data-velvet="countdown-heading"></h2>
        <div class="countdown-timer" id="countdown-timer">
            <div class="countdown-circle">
                <div class="countdown-value" id="days">00</div>
                <div class="countdown-label"></div>
            </div>
            <div class="countdown-circle">
                <div class="countdown-value" id="hours">00</div>
                <div class="countdown-label"></div>
            </div>
            <div class="countdown-circle">
                <div class="countdown-value" id="minutes">00</div>
                <div class="countdown-label"></div>
            </div>
            <div class="countdown-circle">
                <div class="countdown-value" id="seconds">00</div>
                <div class="countdown-label"></div>
            </div>
        </div>
    </section>

    <!-- Section 12: Initials -->
    <section class="fade-in delay-4 initials-section">
        <div class="initials"><span data-velvet="initial-0"></span><span data-velvet="initial-1"></span></div>
    </section>
    <script src="./bridge.js"></script>
    <script src="./assets/js/velvet.js"></script>
</body>

</html>
